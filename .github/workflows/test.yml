name: Tests

on:
  push:
    branches: [main]
  pull_request:
    # TODO: remove monaco-0.57.0 once it has merged to main (this PR is stacked on it)
    branches: [main, monaco-0.57.0]
  workflow_dispatch:
    inputs:
      node-red-ref:
        description: "node-red branch, tag or sha to compare node-red-types and the editor fixture with"
        required: false
        default: "master"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  node-red-sync:
    # Depends on node-red's state, not just this repo, so it only runs on request.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:node-red-sync
        env:
          NODE_RED_REF: ${{ inputs.node-red-ref }}
